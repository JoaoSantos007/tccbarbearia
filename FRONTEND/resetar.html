<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redefinir senha — Barbershop System</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
main{background:#202020;padding:28px;border-radius:14px;width:min(420px,calc(100% - 40px));box-sizing:border-box}
label,input,button{display:block;width:100%;box-sizing:border-box;margin-top:12px}
input,button{padding:12px;border-radius:8px;border:1px solid #555}
button{background:#f5c542;border:0;font-weight:bold;cursor:pointer}
#msg{margin-top:14px;overflow-wrap:anywhere}
</style></head>
<body><main><h1>Redefinir senha</h1><p>Este formulário é para desenvolvimento local.</p>
<form id="form"><label for="senha">Nova senha (mínimo 6 caracteres)</label><input id="senha" type="password" minlength="6" required><button type="submit">Salvar nova senha</button></form><p id="msg" role="status"></p></main>
<script>
const API_URL='http://localhost:3000';
const token=new URLSearchParams(location.search).get('token');
const form=document.getElementById('form'), msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{e.preventDefault();if(!token){msg.textContent='Link inválido ou sem token.';return}
try{const r=await fetch(`${API_URL}/resetar-senha`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,nova_senha:document.getElementById('senha').value})});const d=await r.json().catch(()=>({}));msg.textContent=r.ok?(d.mensagem||'Senha redefinida.'): (d.error||d.mensagem||'Não foi possível redefinir a senha.');}
catch{msg.textContent='Erro de conexão com o servidor.'}});
</script></body></html>
